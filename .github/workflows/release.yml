name: Release Obsidian plugin

# Two entry points, and they do different jobs:
#
# - A tag push builds that tag and creates a draft release. This is the only path
#   that releases, because obsidianmd/obsidian-workflows reads GITHUB_REF and
#   refuses to run unless it starts with refs/tags/.
# - workflow_dispatch bumps the version, commits and pushes the tag. It does not
#   release: creating a tag inside a run does not change that run's GITHUB_REF,
#   so a release step here would fail at the end of an otherwise successful bump.
#   Pushing the tag is what starts the release run.
#
# That push has to carry RELEASE_TOKEN, a PAT with contents:write. GitHub does
# not start workflow runs for pushes made with the default GITHUB_TOKEN, so with
# the default token the tag lands and nothing follows it — which is exactly how
# 0.151.0 ended up tagged with no release.

on:
    push:
        tags:
            - '*'
    workflow_dispatch:
        inputs:
            release_type:
                description: 'Semantic version bump (used for manual releases and automated releases after an upstream sync merge)'
                required: true
                default: patch
                type: choice
                options:
                    - patch
                    - minor
                    - major

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            GH_REPO: ${{ github.repository }}
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            # Fail before touching the repository, rather than after the version
            # commit is already pushed and only the release is missing.
            # The secrets context is not available in a step `if`, so the
            # check runs in the shell.
            - name: Require a release token for the bump path
              if: github.event_name == 'workflow_dispatch'
              env:
                  RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
              run: |
                  if [ -z "$RELEASE_TOKEN" ]; then
                      echo "::error::workflow_dispatch needs RELEASE_TOKEN (a PAT with contents:write) so the tag push starts the release run. Configure this secret before dispatching a new run."
                      exit 1
                  fi

            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}
                  # Persisted for the pushes below; the tag push must not use the
                  # default token, or it starts no release run.
                  token: ${{ secrets.RELEASE_TOKEN || github.token }}

            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            # The npm version hook formats release metadata with local Prettier.
            - name: Install dependencies for the version hook
              if: github.event_name == 'workflow_dispatch'
              run: npm ci

            - name: Bump version and tag
              if: github.event_name == 'workflow_dispatch'
              env:
                  RELEASE_TYPE: ${{ inputs.release_type }}
                  RELEASE_BRANCH: ${{ github.ref_name }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  npm version --no-git-tag-version "$RELEASE_TYPE"
                  node scripts/fork-release.mjs bump
                  version="$(node -p "require('./package.json').version")"
                  if git show-ref --verify --quiet "refs/tags/$version"; then
                      echo "::error::Fork release tag $version already exists; tags must not be reused."
                      exit 1
                  fi
                  git add package.json package-lock.json manifest.json versions.json CHANGELOG.md .github/upstream-release.json
                  git commit -m "Release fork ${version}"
                  git tag "$version"
                  git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
                  git push origin "refs/tags/${version}"
                  echo "Tagged ${version}. The release runs from the tag push." >> "$GITHUB_STEP_SUMMARY"

            - uses: obsidianmd/obsidian-workflows@v1
              if: startsWith(github.ref, 'refs/tags/')
              with:
                  mode: release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Describe the draft release baseline
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  node scripts/fork-release.mjs describe "$RUNNER_TEMP/fork-release"
                  gh release edit "$RELEASE_TAG" \
                      --title "$(cat "$RUNNER_TEMP/fork-release.title")" \
                      --notes-file "$RUNNER_TEMP/fork-release.md"
