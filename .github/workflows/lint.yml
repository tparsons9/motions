name: Node.js build

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']
    workflow_call:

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [24.x]
                # Trimmed from [22.x, 24.x, 26.x]: this fork is for personal, single-environment
                # use, so cross-version compatibility checks aren't needed. 24.x matches release.yml.

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm run format:check
            - run: npm run lint:patterns
            - run: npm run lint:deadcode
            - run: npm run test:unit
