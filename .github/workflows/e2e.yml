name: E2E Tests

# Manual-only on this personal fork: the full suite is 36 shards on Ubuntu plus a
# macOS/Windows cross-platform matrix on the same shards, too heavy to run on every push.
on:
    workflow_dispatch:

# Neovim writes stdpath('log') only for some levels and the child does not
# resolve the runner's HOME the way a shell would, so a crash left nothing
# readable. Obsidian inherits this and spawns the child, so it propagates.
env:
    NVIM_LOG_FILE: /tmp/nvim-debug.log

jobs:
    discover:
        runs-on: ubuntu-latest
        outputs:
            shards: ${{ steps.shard.outputs.shards }}
        steps:
            - uses: actions/checkout@v6
            - id: shard
              run: |
                  MAX_SHARDS=36
                  # rpc-connect-cycle characterises the connect/disconnect cycle
                  # rather than asserting on it, and is dispatched through the
                  # stress workflow, which collects several cold starts.
                  # rpc-latency is a benchmark, not a correctness check. It runs
                  # in the non-blocking e2e-latency job instead, because shared
                  # runners vary enough to move its percentiles on their own.
                  specs=$(find test/specs -name '*.e2e.ts' ! -name 'rpc-latency.e2e.ts' ! -name 'rpc-connect-cycle.e2e.ts' | sort)
                  total=$(echo "$specs" | wc -l)
                  # Use fewer shards when spec count is below MAX_SHARDS
                  if [ "$total" -lt "$MAX_SHARDS" ]; then
                    num_shards=$total
                  else
                    num_shards=$MAX_SHARDS
                  fi
                  # Distribute specs round-robin into shards. Each entry carries a
                  # stable index alongside its spec list: the list is recomputed
                  # whenever the spec count changes, so naming jobs after it made
                  # one recurring failure look like a new flake every commit.
                  shards=$(echo "$specs" | awk -v n="$num_shards" '
                    BEGIN { for (i=0; i<n; i++) a[i]="" }
                    { idx = (NR-1) % n; a[idx] = a[idx] (a[idx]=="" ? "" : ",") $0 }
                    END {
                      printf "["
                      for (i=0; i<n; i++) {
                        if (i>0) printf ","
                        printf "{\"index\":%d,\"specs\":\"%s\"}", i+1, a[i]
                      }
                      printf "]"
                    }
                  ')
                  echo "shards=$shards" >> "$GITHUB_OUTPUT"

    e2e:
        needs: discover
        name: e2e (shard ${{ matrix.shard.index }})
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/${{ github.repository }}/e2e-runner:latest
            env:
                DISPLAY: ':99'
            options: --shm-size=2g
        strategy:
            fail-fast: false
            matrix:
                shard: ${{ fromJson(needs.discover.outputs.shards) }}

        steps:
            - name: Start virtual display
              run: |
                  Xvfb "$DISPLAY" -screen 0 1280x1024x24 +extension GLX -noreset &
                  for _ in $(seq 1 30); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.2; done
                  herbstluftwm &
                  for _ in $(seq 1 30); do herbstclient list_monitors >/dev/null 2>&1 && break; sleep 0.2; done

            - uses: actions/checkout@v6

            - name: Cache npm dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Install dependencies
              run: npm install --include=dev

            - name: Fetch test plugins
              run: bash scripts/fetch-test-plugins.sh

            - name: Build
              run: npm run build:ci-test

            - name: Cache Obsidian
              uses: actions/cache@v5
              with:
                  path: .obsidian-cache
                  key: obsidian-cache-${{ runner.os }}-${{ hashFiles('manifest.json') }}

            - name: Run E2E tests
              shell: bash
              run: |
                  SHARD='${{ matrix.shard.specs }}'
                  SPEC_ARGS=$(echo "$SHARD" | tr ',' '\n' | while read -r spec; do printf ' --spec %s' "$spec"; done)
                  set +e
                  npx wdio run ./wdio.conf.mts $SPEC_ARGS 2>&1 | tee e2e.log
                  rc=${PIPESTATUS[0]}
                  set -e
                  if [ "$rc" -ne 0 ]; then
                    node scripts/report-e2e-failures.mjs e2e.log \
                      "ubuntu shard ${{ matrix.shard.index }}" >> "$GITHUB_STEP_SUMMARY"
                  fi
                  exit "$rc"

    e2e-latency:
        runs-on: ubuntu-latest
        container:
            image: ghcr.io/${{ github.repository }}/e2e-runner:latest
            env:
                DISPLAY: ':99'
            options: --shm-size=2g
        timeout-minutes: 30

        steps:
            - name: Start virtual display
              run: |
                  Xvfb "$DISPLAY" -screen 0 1280x1024x24 +extension GLX -noreset &
                  for _ in $(seq 1 30); do xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break; sleep 0.2; done
                  herbstluftwm &
                  for _ in $(seq 1 30); do herbstclient list_monitors >/dev/null 2>&1 && break; sleep 0.2; done

            - uses: actions/checkout@v6

            - name: Cache npm dependencies
              uses: actions/cache@v5
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Install dependencies
              run: npm install --include=dev

            - name: Fetch test plugins
              run: bash scripts/fetch-test-plugins.sh

            - name: Build
              run: npm run build:ci-test

            - name: Cache Obsidian
              uses: actions/cache@v5
              with:
                  path: .obsidian-cache
                  key: obsidian-cache-${{ runner.os }}-${{ hashFiles('manifest.json') }}
                  restore-keys: obsidian-cache-${{ runner.os }}-

            - name: Run latency benchmark
              shell: bash
              run: |
                  set +e
                  npx wdio run ./wdio.conf.mts --spec test/specs/rpc-latency.e2e.ts > latency.log 2>&1
                  rc=$?
                  set -e

                  cat latency.log
                  node scripts/report-latency.mjs latency.log "$rc" >> "$GITHUB_STEP_SUMMARY"

                  if [ "$rc" -ne 0 ]; then
                    echo "::warning title=RPC latency benchmark did not pass::Non-blocking. Measured percentiles are in the job summary; the failing assertion is in the log above."
                  fi

                  # Never fail the workflow: this job reports a measurement.
                  exit 0

    e2e-cross-platform:
        needs: discover
        name: e2e (${{ matrix.os }}, shard ${{ matrix.shard.index }})
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, windows-latest]
                shard: ${{ fromJson(needs.discover.outputs.shards) }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 40
        env:
            CSC_IDENTITY_AUTO_DISCOVERY: false

        steps:
            - uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm install --include=dev

            - name: Install pinned Neovim
              if: runner.os != 'Windows'
              shell: bash
              run: bash scripts/install-neovim.sh

            - name: Install pinned Neovim on Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: ./scripts/install-neovim.ps1

            - name: Fetch test plugins
              shell: bash
              run: bash scripts/fetch-test-plugins.sh

            - name: Build
              run: npm run build:ci-test

            - name: Cache Obsidian
              uses: actions/cache@v5
              with:
                  path: .obsidian-cache
                  key: obsidian-cache-${{ runner.os }}-${{ hashFiles('manifest.json') }}
                  restore-keys: obsidian-cache-${{ runner.os }}-

            - name: Run E2E tests
              shell: bash
              run: |
                  SHARD='${{ matrix.shard.specs }}'
                  SPEC_ARGS=$(echo "$SHARD" | tr ',' '\n' | while read -r spec; do printf ' --spec %s' "$spec"; done)
                  rc=0
                  for attempt in 1 2 3; do
                    set +e
                    output=$(npx wdio run ./wdio.conf.mts $SPEC_ARGS 2>&1)
                    rc=$?
                    set -e
                    echo "$output"
                    if [ $rc -eq 0 ]; then break; fi
                    if echo "$output" | grep -q 'EPERM'; then
                      echo "::warning::Attempt $attempt hit Windows EPERM, retrying..."
                      sleep 5
                      continue
                    fi
                    break
                  done
                  # Exhausting all three EPERM retries used to fall out of the loop
                  # without exiting, reporting the shard green on three failed runs.
                  if [ "$rc" -ne 0 ]; then
                    printf '%s' "$output" > e2e.log
                    node scripts/report-e2e-failures.mjs e2e.log \
                      "${{ matrix.os }} shard ${{ matrix.shard.index }}" >> "$GITHUB_STEP_SUMMARY"
                    exit "$rc"
                  fi
